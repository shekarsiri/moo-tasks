name: Publish & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build project
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Release commits cannot always be pushed to main, so package.json can lag behind the
      # registry. Bumping from a stale base would publish a version below `latest`.
      - name: Start from the newest of package.json and the npm registry
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view moo-tasks version 2>/dev/null || echo 0.0.0)
          NEWEST=$(printf '%s\n%s\n' "$LOCAL" "$PUBLISHED" | sort -V | tail -1)
          echo "package.json: $LOCAL, npm latest: $PUBLISHED, bumping from: $NEWEST"
          if [ "$NEWEST" != "$LOCAL" ]; then
            npm version "$NEWEST" --no-git-tag-version --allow-same-version
            git commit -am "chore(release): sync version to $NEWEST [skip ci]"
          fi

      - name: Bump version and create git tag
        run: |
          npm version ${{ inputs.bump }} --force -m "chore(release): %s [skip ci]"

      # Trusted publishing needs npm 11.5.1+. Pinned to 11: npm 12 blocks dependency install
      # scripts by default, which leaves better-sqlite3 without its native binding. Upgrading
      # only here keeps `npm ci` above on the npm bundled with Node.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # Authenticates with npm trusted publishing (OIDC via id-token: write), configured on
      # npmjs.com for this repository and publish.yml; no token is passed. Verbose logging
      # shows the OIDC token exchange, which npm otherwise hides when it fails.
      - name: Publish to npm
        run: |
          npm publish --access public --provenance --loglevel verbose

      - name: Push git tag and commit
        run: |
          git push origin --tags
          git push origin main || echo "::warning::Could not push the release commit to main. Open a PR that sets package.json to $(node -p "require('./package.json').version"); the next release syncs from npm either way."
